name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Structural validation
        run: python scripts/validate_repository.py
      - name: Canonical visual assets
        run: python scripts/validate_visual_assets.py
      - name: Regression fixtures
        run: python scripts/run_regression_fixtures.py
      - name: Release packaging smoke test
        shell: bash
        run: |
          python scripts/release_package.py --source-commit "$GITHUB_SHA" --output-dir dist-smoke
          rm -rf /tmp/create-maths-assessment-smoke
          mkdir -p /tmp/create-maths-assessment-smoke
          unzip -q "dist-smoke/create-maths-assessment-v$(cat VERSION).zip" -d /tmp/create-maths-assessment-smoke
          python /tmp/create-maths-assessment-smoke/scripts/verify_install.py \
            --root /tmp/create-maths-assessment-smoke
          (cd dist-smoke && sha256sum -c SHA256SUMS.txt)
