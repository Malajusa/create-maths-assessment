name: Package release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Structural validation
        run: python scripts/validate_repository.py
      - name: Canonical visual assets
        run: python scripts/validate_visual_assets.py
      - name: Regression fixtures
        run: python scripts/run_regression_fixtures.py
      - name: Build provenance-bound package
        shell: bash
        run: |
          SOURCE_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          python scripts/release_package.py --source-commit "${SOURCE_COMMIT}"
          rm -rf /tmp/create-maths-assessment-verify
          mkdir -p /tmp/create-maths-assessment-verify
          unzip -q "dist/create-maths-assessment-${GITHUB_REF_NAME}.zip" -d /tmp/create-maths-assessment-verify
          python /tmp/create-maths-assessment-verify/scripts/verify_install.py \
            --root /tmp/create-maths-assessment-verify
          sha256sum -c dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/create-maths-assessment-${GITHUB_REF_NAME}.zip" \
            dist/SHA256SUMS.txt \
            dist/INSTALL_MANIFEST.json \
            --title "Create Maths Assessment ${GITHUB_REF_NAME}" \
            --generate-notes
