<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <title>Canonical figures visual proof</title>
  <desc>Assessment-style square, circle and equilateral triangle at normal and compact print sizes.</desc>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="72" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937">Canonical figures</text>
  <text x="72" y="108" font-family="Arial, sans-serif" font-size="18" fill="#475569">Exact geometry • quiet fill • one authoritative outline</text>
  <g fill="#F8FAFC" stroke="#1F2937" stroke-width="7" stroke-linejoin="round">
    <rect x="105" y="190" width="230" height="230"/>
    <circle cx="600" cy="305" r="115"/>
    <polygon points="980,172.263 865,371.449 1095,371.449"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#1F2937">
    <text x="220" y="470">Square</text><text x="600" y="470">Circle</text><text x="980" y="470">Equilateral triangle</text>
  </g>
  <line x1="72" y1="535" x2="1128" y2="535" stroke="#CBD5E1" stroke-width="2"/>
  <text x="72" y="580" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2937">Compact-use check</text>
  <g transform="translate(340 610)" fill="#F8FAFC" stroke="#1F2937" stroke-width="5">
    <rect width="80" height="80"/><circle cx="220" cy="40" r="40"/><polygon points="440,0 393.812,80 486.188,80" stroke-linejoin="round"/>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none">
    <path d="M105 438 V454 M335 438 V454 M105 446 H335"/>
  </g>
  <text x="220" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">equal width and height</text>
</svg>
